    if(!r.n)return '<td>—</td>';
    if(r.n<10)return '<td><div class="tile low">样本少<small>n='+r.n+'</small></div></td>';
    const background=[247-31*rate,249-142*rate,252-133*rate].map(Math.round).join(',');
    return '<td><div class="tile" style="background:rgb('+background+')"><b>'+(rate*100).toFixed(1)+'%</b><small>'+r.h+' / '+r.n+'</small></div></td>';
  }).join('')+'</tr>').join('')+'</tbody></table>';
}
['pMode','pStart','pEnd','pScope'].forEach(id=>$(id).onchange=planarRender);
planarRender();
</script>
</body></html>
